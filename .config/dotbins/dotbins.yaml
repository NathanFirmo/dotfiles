plataforms:
  linux:
    - amd64
tools:
  helmfile: helmfile/helmfile
  sops: getsops/sops
  kind: kubernetes-sigs/kind
  task:
    repo: go-task/task
    shell_code: |
      alias t="task"
  yq: mikefarah/yq
  k9s: derailed/k9s
  vcluster:
    repo: loft-sh/vcluster
    tag: v0.23.1
    platform_map:
      macos: darwin
      linux: linux
    asset_patterns: vcluster-{platform}-{arch}
  calibre:
    repo: kovidgoyal/calibre
    binary_name: calibre.txz
    extract_archive: false
    arch_map:
      amd64: x86_64
    asset_patterns:
      linux: calibre-{version}-{arch}.txz
  hugo:
    repo: gohugoio/hugo
    extract_archive: true
    asset_patterns: hugo_extended_{version}_{platform}-{arch}.tar.gz
  zoxide: ajeetdsouza/zoxide
  buf: bufbuild/buf
  fzf: junegunn/fzf
  cloudflared: cloudflare/cloudflared
  stripe: stripe/stripe-cli
  zappy-webhook-listener:
    repo: firmo-tecnologia/zappy-webhook-listener
    extract_archive: false
    asset_patterns:
      linux: zappy-webhook-listener_{version}_linux_{arch}
  dbmate: amacneil/dbmate
  genact: svenstaro/genact
  crush: charmbracelet/crush
  herdr: ogulcancelik/herdr
  glow: charmbracelet/glow
