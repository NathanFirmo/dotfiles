plataforms:
  linux:
    - amd64
tools:
  helmfile: helmfile/helmfile
  sops: getsops/sops
  kind: kubernetes-sigs/kind
  task:
    repo: go-task/task
    shell_code: |
      alias t="task"
  yq: mikefarah/yq
  k9s: derailed/k9s
  vcluster:
    repo: loft-sh/vcluster
    tag: v0.23.1
    platform_map:
      macos: darwin
      linux: linux
    asset_patterns: vcluster-{platform}-{arch}
  zoxide: ajeetdsouza/zoxide
  buf: bufbuild/buf
  fzf: junegunn/fzf
  cloudflared: cloudflare/cloudflared
  stripe: stripe/stripe-cli
  dbmate: amacneil/dbmate
  genact: svenstaro/genact
  crush: charmbracelet/crush
  codex:
    repo: openai/codex
    arch_map:
      amd64: x86_64
      arm64: aarch64
    asset_patterns:
      linux: codex-{arch}-unknown-linux-musl.tar.gz
  hugo:
    repo: gohugoio/hugo
    extract_archive: true
    asset_patterns: hugo_extended_0.152.2_{platform}-{arch}.tar.gz
